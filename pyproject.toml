[project]
name = "timetable"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KyleForan", email = "no-reply@null.co" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "requests>=2.34.2",
    "textual>=8.2.8",
]

[project.scripts]
timetable = "timetable:main"
cli = "cli:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.fastapi]
entrypoint = "src.timetable.api:app"
